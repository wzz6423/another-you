name: CI Skip

on:
  issue_comment:
    types: [created, edited, deleted]
  pull_request_target: # zizmor: ignore[dangerous-triggers] 仅默认分支可信处理器，绝不 checkout PR head。
    types: [synchronize]
  workflow_dispatch:
    inputs:
      pull-request:
        description: Pull request number whose directives should be reconciled.
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.event.pull_request.number || inputs.pull-request }}
  cancel-in-progress: false

jobs:
  apply:
    name: Apply skip directives
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request_target' ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request != null &&
      ((github.event.comment.user.type != 'Bot' &&
      (contains(github.event.comment.body, 'skip-') || contains(github.event.changes.body.from, 'skip-'))) ||
      (github.event.action == 'deleted' && github.event.comment.user.login == 'github-actions[bot]' &&
      github.event.comment.user.type == 'Bot' && startsWith(github.event.comment.body, '<!-- another-you-ci-skip -->'))))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted skip processor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile current head directives and real workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pull-request }}
          CI_SKIP_DELETED_SUMMARY: ${{ github.event.action == 'deleted' && github.event.comment.user.login == 'github-actions[bot]' && github.event.comment.user.type == 'Bot' && startsWith(github.event.comment.body, '<!-- another-you-ci-skip -->') && github.event.comment.body || '' }}
        run: ruby .github/scripts/ci-skip-directives.rb apply
