name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent-core:
    name: Agent core
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: agent-core/package-lock.json
      - name: Install dependencies
        run: make deps
      - name: Check TypeScript
        working-directory: agent-core
        run: npm run check
      - name: Run Agent core tests
        run: make test-agent
      - name: Clean up dependencies
        if: always()
        run: rm -rf agent-core/node_modules

  swift:
    name: SwiftUI macOS
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node for sidecar integration tests
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
          cache: npm
          cache-dependency-path: agent-core/package-lock.json
      - name: Verify Xcode 27 toolchain
        run: |
          ./scripts/xcode-toolchain.sh --version
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
      - name: Install sidecar dependencies
        run: make deps
      - name: Build
        run: |
          make build
          BIN_DIR="$(./scripts/xcode-toolchain.sh build --package-path macos/AnotherYou --show-bin-path)"
          xcrun vtool -show-build "$BIN_DIR/AnotherYou"
          test "$(xcrun vtool -show-build "$BIN_DIR/AnotherYou" | awk '$1 == "sdk" && !found { print $2; found = 1 }')" = "$(xcrun --sdk macosx --show-sdk-version)"
      - name: Test
        run: make test-swift
      - name: Test development lifecycle
        run: make test-scripts
      - name: Test release tooling
        run: make test-release
      - name: Build development app
        env:
          OUTPUT_DIRECTORY: ${{ runner.temp }}/another-you-app
          BUNDLE_NODE: "1"
        run: make build-package
      - name: Verify development app
        run: |
          APP_PATH="${{ runner.temp }}/another-you-app/Another You.app"
          test -x "$APP_PATH/Contents/MacOS/AnotherYou"
          test -x "$APP_PATH/Contents/Resources/runtime/node"
          test -f "$APP_PATH/Contents/Resources/agent-core/src/cli.ts"
          test -x "$APP_PATH/Contents/Frameworks/Sparkle.framework/Versions/B/Autoupdate"
          xcrun vtool -show-build "$APP_PATH/Contents/MacOS/AnotherYou"
          otool -L "$APP_PATH/Contents/MacOS/AnotherYou" | grep -F '@rpath/Sparkle.framework/'
          otool -l "$APP_PATH/Contents/MacOS/AnotherYou" | grep -F '@executable_path/../Frameworks'
          test "$(/usr/libexec/PlistBuddy -c 'Print :AnotherYouUpdatesEnabled' "$APP_PATH/Contents/Info.plist")" = false
          plutil -lint "$APP_PATH/Contents/Info.plist"
          codesign --verify --deep --strict "$APP_PATH"
          printf '%s\n' '{"op":"status"}' '{"op":"shutdown"}' |
            ./scripts/run-isolated-tests.sh "$APP_PATH/Contents/Resources/runtime/node" --experimental-strip-types \
              "$APP_PATH/Contents/Resources/agent-core/src/cli.ts" --stdio \
              --config "${{ runner.temp }}/another-you-smoke/config.json" > "${{ runner.temp }}/another-you-events.jsonl"
          node -e 'const fs = require("node:fs"); const events = fs.readFileSync(process.argv[1], "utf8").trim().split("\n").map(JSON.parse); if (!events.some(e => e.kind === "agent.status") || events.some(e => e.kind === "agent.error")) process.exit(1)' "${{ runner.temp }}/another-you-events.jsonl"
      - name: Archive development app
        run: ditto -c -k --sequesterRsrc --keepParent "${{ runner.temp }}/another-you-app/Another You.app" "${{ runner.temp }}/another-you-app/Another-You-macOS.zip"
      - name: Upload development app
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Another-You-macOS-development-${{ runner.arch }}
          path: ${{ runner.temp }}/another-you-app/Another-You-macOS.zip
          retention-days: 7
          if-no-files-found: error
      - name: Clean up build artifacts
        if: always()
        run: rm -rf macos/AnotherYou/.build agent-core/node_modules "${{ runner.temp }}/another-you-app" "${{ runner.temp }}/another-you-smoke" "${{ runner.temp }}/another-you-events.jsonl"

  website:
    name: Website and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.19.0
      - name: Check website and scripts
        run: |
          make help
          test -s website/index.html
          for file in website/*.js; do node --check "$file"; done
          for file in scripts/*.sh agent-core/scripts/*.sh; do bash -n "$file"; done
          git diff --check
