version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "04:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /agent-core
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "04:15"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      agent-dependencies:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /macos/AnotherYou/MarkdownRenderer
    cooldown:
      default-days: 7
    schedule:
      interval: weekly
      day: monday
      time: "04:30"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 3
    groups:
      markdown-dependencies:
        patterns: ["*"]
