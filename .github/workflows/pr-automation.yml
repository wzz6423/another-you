name: PR Automation

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] 仅执行默认分支脚本，不检出 PR head。
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  automate:
    name: PR Automation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Synchronize labels and format feedback
        env:
          GH_TOKEN: ${{ github.token }}
          CONTRIBUTION_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: ruby .github/scripts/contribution-automation.rb pr
