name: Feature request
description: Propose a small, useful change to Another You.
title: "[Feature] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Search existing Issues first. You may write answers in English or Chinese.
        Describe the user problem and the smallest useful behavior.
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Select the affected part of the project.
      options:
        - macOS App
        - Agent & Models
        - CI & Build
        - Website
        - Documentation
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Describe your use case and the difficulty you face today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest useful interaction or behavior.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional. Explain why existing options do not meet the need.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional. Include sanitized screenshots, sketches, or other context.
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks
      options:
        - label: I searched existing Issues and confirmed that this is not a duplicate.
          required: true
